name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  repository_dispatch:
    types: [dato-publish]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          DATOCMS_API_TOKEN: ${{ secrets.DATOCMS_API_TOKEN }}
          DATOCMS_ENVIRONMENT: ${{ secrets.DATOCMS_ENVIRONMENT }}
      - id: deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RZEST_ENGINEERS_PRD }}
          channelId: live
          projectId: rzest-engineers-prd
      # The action sometimes reports failure even when the deploy actually
      # succeeded server-side (see #40: a network "premature close" causes
      # firebase-tools to retry an already-completed finalize/release call,
      # and the retry gets rejected as redundant). Don't trust the action's
      # exit code alone — verify against the real URL before failing the job.
      - name: Verify deploy if action reported failure
        if: steps.deploy.outcome == 'failure'
        run: |
          sleep 10
          code=$(curl -sL -o /dev/null -w "%{http_code}" "https://rzest-engineers-prd.web.app/")
          if [ "$code" = "200" ]; then
            echo "::notice::Deploy action reported failure, but production responded HTTP $code — treating as a successful deploy (see #40)."
          else
            echo "::error::Deploy action failed AND production check failed (HTTP $code) — this is a real failure."
            exit 1
          fi
