name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          DATOCMS_API_TOKEN: ${{ secrets.DATOCMS_API_TOKEN }}
          DATOCMS_ENVIRONMENT: ${{ secrets.DATOCMS_ENVIRONMENT }}
      - id: deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RZEST_ENGINEERS_PRD }}
          projectId: rzest-engineers-prd
      # The action sometimes reports failure even when the deploy actually
      # succeeded server-side (see #40: a network "premature close" causes
      # firebase-tools to retry an already-completed finalize/release call,
      # and the retry gets rejected as redundant). Don't trust the action's
      # exit code alone — look up the real preview channel URL and verify
      # it before failing the job.
      - name: Verify deploy if action reported failure
        if: steps.deploy.outcome == 'failure'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RZEST_ENGINEERS_PRD }}
        run: |
          sleep 10
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
          url=$(npx firebase-tools --json hosting:channel:list --project rzest-engineers-prd \
            | jq -r --arg prefix "pr${{ github.event.pull_request.number }}-" \
              '.result.channels[] | select(.name | contains($prefix)) | .url' | head -n1)
          rm -f /tmp/gcp-key.json
          if [ -z "$url" ]; then
            echo "::error::Deploy action failed and no matching preview channel was found — this is a real failure."
            exit 1
          fi
          code=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
          if [ "$code" = "200" ]; then
            echo "::notice::Deploy action reported failure, but preview ($url) responded HTTP $code — treating as a successful deploy (see #40)."
          else
            echo "::error::Deploy action failed AND preview check failed (HTTP $code) — this is a real failure."
            exit 1
          fi
